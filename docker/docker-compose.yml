services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "127.0.0.1:8051:3000"

    environment:
      PORT: 3000

    volumes:
      - integration-example-db:/app/server/data

    restart: unless-stopped

    env_file:
      - .env

    extra_hosts:
        - "host.docker.internal:host-gateway"

volumes:
  integration-example-db:
